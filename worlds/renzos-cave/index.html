<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Renzo’s Cave Cockpit</title>

  <!-- Neon Theme -->
  <link rel="stylesheet" href="neon-theme.css" />

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r152/three.min.js"></script>

  <style>
    body {
      margin: 0;
      background: #050509;
      overflow: hidden;
      font-family: "Segoe UI", sans-serif;
    }

    #cockpit-root {
      height: 45vh;
      overflow: hidden;
      border-bottom: 1px solid #222;
    }

    #cave-room-container {
      height: 55vh;
      width: 100vw;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <!-- COCKPIT UI -->
  <div id="cockpit-root">

    <!-- COMPLEXITY PANEL -->
    <section id="complexity-panel" class="cockpit-panel">
      <div class="cockpit-panel-header">
        <div class="cockpit-panel-title">Complexity Radar</div>
        <span id="engine-connection" class="engine-connection" role="status">Connecting...</span>
        <button id="execute-cycle" class="cockpit-action" type="button" disabled>Execute Cycle</button>
      </div>
      <div id="complexity-radar-container">
        <svg id="complexityRadar" viewBox="0 0 200 200">
          <polygon id="complexityPolygon" points="100,20 180,100 100,180 20,100" />
        </svg>
      </div>
    </section>

    <!-- GAUGES -->
    <section id="gauge-panel" class="cockpit-panel">
      <div class="cockpit-panel-header">
        <div class="cockpit-panel-title">Metabolic Gauges</div>
      </div>

      <div class="gauge-row">
        <div class="gauge-label">Stress</div>
        <div id="stressBar" class="gauge-bar"><div class="gauge-fill"></div></div>
      </div>

      <div class="gauge-row">
        <div class="gauge-label">Efficiency</div>
        <div id="efficiencyBar" class="gauge-bar"><div class="gauge-fill"></div></div>
      </div>
    </section>

    <!-- SCHEDULER -->
    <section id="scheduler-panel" class="cockpit-panel">
      <div class="cockpit-panel-header">
        <div class="cockpit-panel-title">Scheduler</div>
      </div>
      <div class="scheduler-lists">
        <div class="scheduler-list">
          <div class="scheduler-list-title">Active Tasks</div>
          <ul id="taskQueue"></ul>
        </div>
        <div class="scheduler-list">
          <div class="scheduler-list-title">Deferred</div>
          <ul id="deferredTasks"></ul>
        </div>
      </div>
    </section>

    <!-- ENTROPY -->
    <section id="entropy-panel" class="cockpit-panel">
      <div class="cockpit-panel-header">
        <div class="cockpit-panel-title">Entropy</div>
      </div>

      <div class="entropy-row">
        <span class="entropy-label">Branch Entropy</span>
        <span id="branchEntropy" class="entropy-value">0</span>
      </div>

      <div class="entropy-row">
        <span class="entropy-label">Erasure Entropy</span>
        <span id="erasureEntropy" class="entropy-value">0</span>
      </div>
    </section>

    <!-- REFLEX INDICATOR -->
    <div id="reflexPanel">Idle</div>

  </div>

  <!-- CAVE ROOM BELOW COCKPIT -->
  <div id="cave-room-container"></div>

  <!-- Organism Runtime + Cockpit UI -->
  <script type="module">
    import { CaveCockpitUI } from "./cockpit-ui.js";
    import { simulationState } from "./cave/runtime/simulation-state.js";

    const ui = new CaveCockpitUI();
    const executeButton = document.getElementById("execute-cycle");
    const connectionStatus = document.getElementById("engine-connection");

    simulationState.subscribe(signals => ui.update(signals));

    function getWebSocketUrl() {
      if (import.meta.env.VITE_ENGINE_WS_URL) return import.meta.env.VITE_ENGINE_WS_URL;

      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      const hostname = window.location.hostname;
      if (hostname.endsWith(".app.github.dev")) {
        const backendHost = hostname.replace(/-\d+\.app\.github\.dev$/, "-8001.app.github.dev");
        return `${protocol}//${backendHost}/ws`;
      }

      return `${protocol}//${hostname}:8001/ws`;
    }

    const socket = new WebSocket(getWebSocketUrl());

    socket.addEventListener("open", () => {
      executeButton.disabled = false;
      connectionStatus.textContent = "Engine connected";
      connectionStatus.dataset.connected = "true";
    });

    socket.addEventListener("message", event => {
      const message = JSON.parse(event.data);
      if (message.type === "TELEMETRY") {
        simulationState.update(message.state);
      } else if (message.type === "ERROR") {
        connectionStatus.textContent = message.message;
      }
    });

    socket.addEventListener("close", () => {
      executeButton.disabled = true;
      connectionStatus.textContent = "Engine disconnected";
      connectionStatus.dataset.connected = "false";
    });

    socket.addEventListener("error", () => {
      executeButton.disabled = true;
      connectionStatus.textContent = "Engine unavailable";
      connectionStatus.dataset.connected = "false";
    });

    executeButton.addEventListener("click", () => {
      if (socket.readyState === WebSocket.OPEN) {
        socket.send(JSON.stringify({ action: "EXECUTE_CYCLE" }));
      }
    });
  </script>

  <!-- CAVE ROOM SCRIPT -->
  <script type="module" src="cave-room.js"></script>

</body>
</html>
