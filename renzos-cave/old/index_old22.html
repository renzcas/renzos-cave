<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Renzo’s Cave Cockpit</title>
  <link rel="stylesheet" href="cave-ui/theme/neon-theme.css" />
  <style>
    body {
      margin: 0;
      background: #0b0b14;
      color: #dcdcff;
      font-family: "Segoe UI", sans-serif;
      overflow: hidden;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 10px 20px;
      background: #111122;
      border-bottom: 1px solid #22223a;
      font-weight: bold;
      letter-spacing: 1px;
    }
    main {
      flex: 1;
      display: flex;
      flex-wrap: wrap;
      overflow-y: auto;
      padding: 10px;
    }
  </style>
</head>
<body>
  <div id="app">
    <header>⚙️ Renzo’s Cave Cockpit</header>
    <main id="layout-root"></main>
  </div>

  <script type="module" src="main-ui.js"></script>
</body>
</html>
